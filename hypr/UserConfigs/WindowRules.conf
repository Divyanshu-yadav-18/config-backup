# /* ---- 💫 SwayStation Ported Window Rules ---- */  #
# Workspace assignments and floating rules ported from Sway config
# Uses windowrule + match:class/match:title syntax (NOT windowrulev2)

# ─── Workspace Assignments ────────────────────────────────────────────────────
# WS1: Terminal
windowrule = workspace 1, match:class ^(foot|footclient)$

# WS2: Browsers
windowrule = workspace 2, match:class ^([Ff]irefox|firefox-developer-edition)$
windowrule = workspace 2, match:class ^([Bb]rave-browser.*)$
windowrule = workspace 2, match:class ^(librewolf)$
windowrule = workspace 2, match:class ^(zen-alpha|zen|zen-browser)$

# WS3: Dev Tools
windowrule = workspace 3, match:class ^([Pp]ostman)$
windowrule = workspace 3, match:class ^([Mm]ongodb.*)$
windowrule = workspace 3, match:class ^(pgadmin.*)$
windowrule = workspace 3, match:class ^(beekeeper.*)$

# WS4: File Manager
windowrule = workspace 4, match:class ^(pcmanfm.*|[Pp]cmanfm-qt)$

# WS5: Communication
windowrule = workspace 5, match:class ^(org\.telegram\.desktop|io\.github\.tdesktop_x64\.TDesktop)$
windowrule = workspace 5, match:class ^([Vv]esktop|[Dd]iscord|[Ww]ebCord)$

# WS6: Graphics
windowrule = workspace 6, match:class ^(gimp.*|Gimp.*)$
windowrule = workspace 6, match:class ^(org\.inkscape\.Inkscape|inkscape)$

# WS7: Office / Documents
windowrule = workspace 7, match:class ^(.*office.*|libreoffice.*)$
windowrule = workspace 7, match:class ^(org\.pwmt\.zathura|zathura)$

# WS8: Media Production
windowrule = workspace 8, match:class ^(kdenlive)$
windowrule = workspace 8, match:class ^(com\.obsproject\.Studio)$

# WS9: Gaming
windowrule = workspace 9, match:class ^([Ss]team)$
windowrule = workspace 9, match:class ^(steam_app_.*)$
windowrule = workspace 9, match:class ^([Ll]utris)$
windowrule = workspace 9, match:class ^(heroic|com\.heroicgameslauncher\.hgl)$
windowrule = workspace 9, match:class ^(faugus.*)$

# WS10: Utilities
windowrule = workspace 10, match:class ^(nwg-look)$
windowrule = workspace 10, match:class ^(localsend.*)$
windowrule = workspace 10, match:class ^(qbittorrent|org\.qbittorrent\.qBittorrent)$

# ─── Sway-Ported Floating Rules ──────────────────────────────────────────────
# satty (screenshot editor) → fullscreen
windowrule = fullscreen 1, match:class ^(satty|com\.gabm\.satty)$

# GIMP: float sub-windows, unfloat main
windowrule = float 1, match:class ^(gimp.*|Gimp.*)$, match:title negative:(GNU Image Manipulation Program)
windowrule = tile 1, match:class ^(gimp.*|Gimp.*)$, match:title (GNU Image Manipulation Program)

# Inkscape: float sub-windows, unfloat main  
windowrule = float 1, match:class ^(org\.inkscape\.Inkscape|inkscape)$, match:title negative:(Inkscape)
windowrule = tile 1, match:class ^(org\.inkscape\.Inkscape|inkscape)$, match:title (Inkscape)

# qBittorrent: float sub-windows, unfloat main
windowrule = float 1, match:class ^(qbittorrent|org\.qbittorrent\.qBittorrent)$, match:title negative:(qBittorrent)
windowrule = tile 1, match:class ^(qbittorrent|org\.qbittorrent\.qBittorrent)$, match:title (qBittorrent v)

# OBS: float sub-windows, unfloat main
windowrule = float 1, match:class ^(com\.obsproject\.Studio)$, match:title negative:(OBS)
windowrule = tile 1, match:class ^(com\.obsproject\.Studio)$, match:title (OBS)

# Telegram file chooser dialog
windowrule = float 1, match:class ^(org\.telegram\.desktop)$, match:title (Choose)
windowrule = size 70% 75%, match:class ^(org\.telegram\.desktop)$, match:title (Choose)
windowrule = center 1, match:class ^(org\.telegram\.desktop)$, match:title (Choose)

# LibreOffice Open dialog
windowrule = float 1, match:class ^(.*soffice.*)$, match:title (Open)
windowrule = size 70% 75%, match:class ^(.*soffice.*)$, match:title (Open)
windowrule = center 1, match:class ^(.*soffice.*)$, match:title (Open)
