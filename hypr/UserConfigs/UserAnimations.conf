# /* ---- 💫 Retro-Smooth Workstation Preset 💫 ---- */
# Mechanical acceleration with butter-smooth exponential deceleration.

animations {
    enabled = true
    bezier = retroSnap, 0.16, 1, 0.3, 1
    bezier = retroDecel, 0.05, 0.9, 0.1, 1.05
    bezier = retroGlide, 0.25, 1, 0.5, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 4, retroSnap, slide
    animation = windowsIn, 1, 3.5, retroSnap, popin 80%
    animation = windowsOut, 1, 3, retroSnap, popin 80%
    animation = windowsMove, 1, 4, retroSnap, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, retroGlide, slide
    animation = specialWorkspace, 1, 4, retroSnap, slidevert
}
