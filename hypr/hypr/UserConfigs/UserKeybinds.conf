# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# settings for User defaults apps - set your default terminal and file manager on this file
source= $UserConfigs/01-UserDefaults.conf

# common shortcuts
bind = $mainMod, SPACE, exec, pkill rofi || true && rofi -config ~/.config/rofi-swaystation/config.rasi -show drun -modi drun,filebrowser,run,window # Main Menu (APP Launcher)
bind = $mainMod, A, global, quickshell:overviewToggle # desktop overview (if installed)
bind = $mainMod, R, exec, foliate # Launch foliate the eBook readers
bind = $mainMod, V, exec, $scriptsDir/ClipManager.sh # Clipboard Manager
bind = $mainMod, E, exec, kitty --title tmuxifier -e tmuxifier load-session web-dev  # Launch tmuxifier
bind = ALT, N, exec, nmgui # Whatsapp-Linux

# FEATURES / EXTRAS
bind = ALT, H, exec, $scriptsDir/KeyHints.sh # help / cheat sheet
bind = $mainMod SHIFT, R, exec, $scriptsDir/Refresh.sh # Refresh waybar, swaync, rofi
bind = $mainMod SHIFT, O, exec, $scriptsDir/ChangeBlur.sh # Toggle blur settings 
bind = $mainMod SHIFT, T, exec, $UserScripts/Toggle-tuned.sh # Toggle animations ON/OFF
bind = $mainMod SHIFT, D, exec, $UserScripts/SyncDotfiles.sh # Sync dotfiles
bind = $mainMod SHIFT, B, exec, $UserScripts/SyncBlog.sh # Sync dotfiles
bind = $mainMod SHIFT, C, exec, $UserScripts/RcloneSync.sh # Sync Document folder to google drive
bind = $mainMod SHIFT, P, exec, hyprpicker -a / –autocopy # color picker for hyprland
bind = $mainMod SHIFT, V, exec, systemd-run --user --scope $scriptsDir/parrotOS-KVM.sh # start yazi in foot
bind = $mainMod, F, fullscreen # whole full screen
bind = $mainMod SHIFT, Return, exec, $scriptsDir/Dropterminal.sh $term # Dropdown terminal
bind = $mainMod ALT, F, fullscreen, 1 # fake full screen
bind = $mainMod SHIFT, SPACE, togglefloating, #Float Mode
bind = $mainMod ALT, SPACE, exec, hyprctl dispatch workspaceopt allfloat #All Float Mode
bind = $mainMod ALT, E, exec, $scriptsDir/RofiEmoji.sh # emoji menu


# Desktop zooming or magnifier
bind = $mainMod ALT, mouse_down, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bind = $mainMod ALT, mouse_up, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')" 

## NOTES for ja (Hyprland version 0.39 (Ubuntu 24.04))

# Waybar / Bar related
bind = $mainMod CTRL ALT, B, exec, pkill -SIGUSR1 waybar # Toggle hide/show waybar 
bind = $mainMod CTRL, B, exec, $scriptsDir/WaybarStyles.sh # Waybar Styles Menu
bind = $mainMod ALT, B, exec, $scriptsDir/WaybarLayout.sh # Waybar Layout Menu

# FEATURES / EXTRAS (UserScripts)
bind = $mainMod , W, exec, $UserScripts/WallpaperSelect.sh # Select wallpaper to apply
bind = $mainMod SHIFT, W, exec, $UserScripts/WallpaperEffects.sh # Wallpaper Effects by imagemagick
bind = CTRL ALT, W, exec, $UserScripts/WallpaperRandom.sh # Random wallpapers
bind = $mainMod SHIFT, A, exec, $scriptsDir/Animations.sh #hyprland animations menu
bind = $mainMod CTRL, C, exec, $UserScripts/RofiCalc.sh # calculator (qalculate)


# For passthrough keyboard into a VM
# to unbind


# Removed One 
bind = $mainMod, S, exec, $scriptsDir/RofiSearch.sh # Google search using rofi

#APP EXECUTION --

bind = ALT, B, exec, blender
bind = ALT, Return, exec, ghostty
bind = ALT, K, exec, kdenlive 
bind = ALT, S, exec, flatpak run com.stremio.Stremio
bind = ALT, Z, exec, zen-browser
bind = ALT SHIFT, O, exec, obsidian --ozone-platform=x11 


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║             SwayStation — Ported Submaps & Keybinds                        ║
# ║                                                                            ║
# ║  Sway "modes" → Hyprland "submaps"                                        ║
# ║  All existing keybinds above are preserved.                                ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

$bookmarkScript = $HOME/.config/hypr/UserScripts/bookmarks.sh

# ─── Resize Submap ────────────────────────────────────────────────────────────
# Sway's "resize" mode. SUPER+CTRL+R to enter, h/j/k/l to resize, Escape to exit.
# NOTE: SUPER+R is bound to foliate — kept as-is.
bind = $mainMod CTRL, R, submap, resize
submap = resize
binde = , H, resizeactive, -30 0
binde = , L, resizeactive, 30 0
binde = , K, resizeactive, 0 -30
binde = , J, resizeactive, 0 30
binde = , Left, resizeactive, -30 0
binde = , Right, resizeactive, 30 0
binde = , Up, resizeactive, 0 -30
binde = , Down, resizeactive, 0 30
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = , Space, submap, reset
submap = reset

# ─── Swap Submap ──────────────────────────────────────────────────────────────
# Sway's "swap" mode. SUPER+SHIFT+U to enter, Shift+h/j/k/l to swap windows.
bind = $mainMod SHIFT, U, submap, swap
submap = swap
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, L, swapwindow, r
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = , Space, submap, reset
submap = reset

# ─── Launch Submap ────────────────────────────────────────────────────────────
# Sway's "launch" mode. SUPER+CTRL+Return to enter, then keys to launch apps.
# SUPER+Return (terminal) is kept as direct bind above.
bind = $mainMod CTRL, Return, submap, launch
submap = launch
bind = $mainMod, Return, exec, $term
bind = $mainMod, Return, submap, reset
bind = $mainMod, W, exec, zen-browser
bind = $mainMod, W, submap, reset
bind = $mainMod, I, exec, zen-browser --private-window
bind = $mainMod, I, submap, reset
bind = $mainMod, N, exec, thunar
bind = $mainMod, N, submap, reset
bind = $mainMod, O, exec, zathura
bind = $mainMod, O, submap, reset
bind = $mainMod, B, exec, blueman-manager
bind = $mainMod, B, submap, reset
bind = $mainMod, P, exec, pavucontrol
bind = $mainMod, P, submap, reset
bind = $mainMod, M, exec, foot -e cmus
bind = $mainMod, M, submap, reset
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = , Space, submap, reset
submap = reset

# ─── Picker Submap ────────────────────────────────────────────────────────────
# Sway's "picker" mode for rofi menus. SUPER+D to enter.
bind = $mainMod, D, submap, picker
submap = picker
bind = $mainMod, D, exec, pkill rofi || true && rofi -config ~/.config/rofi-swaystation/config.rasi -show drun -modi drun,filebrowser,run,window
bind = $mainMod, D, submap, reset
bind = $mainMod SHIFT, D, exec, rofi -config ~/.config/rofi-swaystation/config.rasi -show run
bind = $mainMod SHIFT, D, submap, reset
bind = $mainMod, W, exec, rofi -config ~/.config/rofi-swaystation/config.rasi -show window
bind = $mainMod, W, submap, reset
bind = $mainMod, E, exec, rofimoji --prompt "Emoji" --max-recent 0 --selector rofi --action clipboard --selector-args "-config ~/.config/rofi-swaystation/config.rasi"
bind = $mainMod, E, submap, reset
bind = $mainMod SHIFT, E, exec, $scriptsDir/Wlogout.sh
bind = $mainMod SHIFT, E, submap, reset
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = , Space, submap, reset
submap = reset

# ─── Bookmarks Submap ────────────────────────────────────────────────────────
# Sway's "bookmarks" mode. SUPER+SHIFT+W to enter.
# Opens bookmarks in tab/window/private mode. Requires bookmarks.sh + bookmark files
# in ~/.local/share/config_dotfiles/bookmarks/*.txt
bind = $mainMod SHIFT, G, submap, bookmarks
submap = bookmarks
bind = , M, exec, $bookmarkScript tab all
bind = , M, submap, reset
bind = SHIFT, M, exec, $bookmarkScript private all
bind = SHIFT, M, submap, reset
bind = , N, exec, $bookmarkScript window all
bind = , N, submap, reset
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = , Space, submap, reset
submap = reset

# ─── Bookmarks Category Submap ───────────────────────────────────────────────
# Sway's "bookmarks_category" mode. SUPER+CTRL+G to enter.
# Browse bookmarks by category file first, then select a bookmark.
bind = $mainMod CTRL, G, submap, bookmarks_category
submap = bookmarks_category
bind = , M, exec, $bookmarkScript tab category
bind = , M, submap, reset
bind = SHIFT, M, exec, $bookmarkScript private category
bind = SHIFT, M, submap, reset
bind = , N, exec, $bookmarkScript window category
bind = , N, submap, reset
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = , Space, submap, reset
submap = reset

# ─── Script Submap ────────────────────────────────────────────────────────────
# Sway's "script" mode for utilities. SUPER+CTRL+SHIFT+S to enter.
bind = $mainMod CTRL SHIFT, S, submap, script
submap = script
bind = , B, exec, $scriptsDir/WaybarStyles.sh
bind = , B, submap, reset
bind = , T, exec, $scriptsDir/Hyprsunset.sh toggle
bind = , T, submap, reset
bind = , W, exec, $UserScripts/WallpaperSelect.sh
bind = , W, submap, reset
bind = , N, exec, nmgui
bind = , N, submap, reset
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = , Space, submap, reset
submap = reset

# ─── Notification Submap ──────────────────────────────────────────────────────
# Sway's "notify" mode. SUPER+SHIFT+M to enter.
bind = $mainMod SHIFT, M, submap, notify
submap = notify
bind = , M, exec, swaync-client -C
bind = SHIFT, M, exec, swaync-client -C --all
bind = SHIFT, M, submap, reset
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = , Space, submap, reset
submap = reset

# ─── Additional Sway-Ported Binds ────────────────────────────────────────────

# Media player controls via SUPER+Shift+arrows (Sway style)
bind = $mainMod SHIFT, Up, exec, playerctl play
bind = $mainMod SHIFT, Down, exec, playerctl pause
bind = $mainMod SHIFT, Right, exec, playerctl next
bind = $mainMod SHIFT, Left, exec, playerctl previous









